<div class="day-view">
  <div class="day-header">
    <h2>{{ formatDayHeader() }}</h2>
  </div>

  <div class="day-content" cdkDropList (cdkDropListDropped)="onAppointmentDrop($event)">
    <app-time-grid
      [date]="currentDate"
      (timeSlotClick)="onTimeSlotClick($event)">
    </app-time-grid>

    <div class="appointments-overlay">
      @for (appointment of getDayAppointments(); track appointment.id) {
        <app-appointment-card
          [appointment]="appointment"
          [position]="getAppointmentPosition(appointment)"
          (appointmentClick)="onAppointmentClick($event)"
          (appointmentResize)="onAppointmentResize($event)">
        </app-appointment-card>
      }
    </div>
  </div>
</div>
