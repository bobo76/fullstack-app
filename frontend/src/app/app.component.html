<div class="app-container">
  <app-sidebar (viewChange)="onViewChange($event)"></app-sidebar>

  <main class="main-content">
    @if (currentView() === 'calendar') {
      <app-calendar-view></app-calendar-view>
    } @else if (currentView() === 'appointment-types') {
      <app-appointment-type-list></app-appointment-type-list>
    } @else if (currentView() === 'settings') {
      <app-settings-view></app-settings-view>
    }
  </main>
</div>
